<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solomon Olufelo — Videographer & Web Developer, Brampton</title>
    <meta name="description" content="" />
    <link rel="canonical" href="https://captainsolo.ca/" />
    <!--head-->
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // Apply the saved or system theme before first paint so pages never flash the wrong colours.
      document.documentElement.classList.add('js') // scroll reveals only hide things when JS can show them again
      try {
        // ?motion=on brings scroll effects back for a visitor whose system asks for reduced motion (src/motion.ts)
        var m = new URLSearchParams(location.search).get('motion')
        if (m === 'on' || m === 'off') localStorage.setItem('motion', m)
        if (localStorage.getItem('motion') === 'on') document.documentElement.classList.add('motion-on')
      } catch (e) {}
      try {
        // the greeting intro (Curtain.tsx): first page of a visit only
        var calm = matchMedia('(prefers-reduced-motion: reduce)').matches && !document.documentElement.classList.contains('motion-on')
        if (!sessionStorage.getItem('intro-seen') && !calm) document.documentElement.classList.add('intro')
        // Slow phones: if the greeting hasn't started within 2.5 s, lift the cover anyway (Curtain.tsx then skips it).
        setTimeout(function () {
          var r = document.documentElement
          if (!r.classList.contains('intro') || r.dataset.greeting) return
          r.classList.remove('intro')
          try {
            sessionStorage.setItem('intro-seen', '1')
          } catch (e) {}
        }, 2500)
      } catch (e) {}
      try {
        var t = localStorage.getItem('theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
