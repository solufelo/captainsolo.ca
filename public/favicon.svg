<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Cybernetic gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="50%" stop-color="#CFA355" />
      <stop offset="100%" stop-color="#805C1E" />
    </linearGradient>
    <!-- Dark glow path -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer cyber hexagonal border -->
  <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="#131110" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Inner tech details -->
  <polygon points="50,12 84,32 84,68 50,88 16,68 16,32" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6" />
  
  <!-- Stylized "S" / Infinite path -->
  <path d="M 32 35 C 32 25, 68 25, 68 35 C 68 45, 32 55, 32 65 C 32 75, 68 75, 68 65" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Core energy nodes -->
  <circle cx="32" cy="35" r="4.5" fill="#FFF3D1" />
  <circle cx="68" cy="65" r="4.5" fill="#FFF3D1" />
</svg>
